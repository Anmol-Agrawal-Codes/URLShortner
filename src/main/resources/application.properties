spring.application.name=UrlShortner

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/urlshortener}
spring.datasource.username=${DB_USERNAME:your_username}
spring.datasource.password=${DB_PASSWORD:your_passord}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5500}
